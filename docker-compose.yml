services:
  attroxx-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attroxx-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - attroxx_data:/app/data
    restart: unless-stopped

  attroxx-soc-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: attroxx-soc-ui
    ports:
      - "3000:3000"
    depends_on:
      attroxx-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  attroxx_data:
